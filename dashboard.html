<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA 5×5 Watch</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#edf4ff;background:#09111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#18385d,#09111f 52%);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(2rem,5vw,4rem);margin:8px 0;letter-spacing:-.05em}.eyebrow{color:#65d6bd;font-weight:800;letter-spacing:.17em;text-transform:uppercase;font-size:.75rem}.muted{color:#9aabc3}.badge{border:1px solid #35506d;background:#172840;border-radius:999px;padding:10px 16px;font-size:.85rem}section{margin-top:34px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#121f32;border:1px solid #27405d;border-radius:20px;padding:20px}.metric{font-size:2rem;font-weight:800;margin:5px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:15px}h2{font-size:1.2rem}.list{display:grid;gap:12px}.player{display:grid;grid-template-columns:minmax(180px,2fr) minmax(220px,3fr) minmax(140px,1fr);align-items:center;gap:20px}.name{font-size:1.15rem;font-weight:750}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stat{text-align:center;background:#20334d;padding:10px 4px;border-radius:10px}.stat.hit{background:#135e56;color:#c7fff2}.stat b{display:block;font-size:1.2rem}.stat small{font-size:.65rem;color:#b9cbe0}.progress{text-align:right;font-weight:750}.progress small{display:block;color:#9aabc3;font-weight:400;margin-top:5px}.alert{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #27405d;padding:12px 0}.alert:last-child{border:0}.empty{padding:25px;color:#9aabc3;text-align:center}@media(max-width:750px){header{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.player{grid-template-columns:1fr}.progress{text-align:left}.wrap{padding:24px 14px}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">Live milestone monitor</div><h1>NBA 5×5 Watch</h1><p class="muted">Points · rebounds · assists · steals · blocks</p></div><span class="badge" id="status">Connecting…</span></header><section class="metrics"><div class="card"><div class="muted">Active games</div><div class="metric" id="games">—</div></div><div class="card"><div class="muted">Players tracked</div><div class="metric" id="tracked">—</div></div><div class="card"><div class="muted">Last successful check</div><div id="checked" style="margin-top:14px;font-weight:700">—</div></div></section><section><div class="section-head"><h2>Leaderboard</h2><span class="muted">Refreshes every 30 seconds</span></div><div class="list" id="leaderboard"></div></section><section class="card"><h2>Recent alerts</h2><div id="alerts"></div></section></main><script src="/app.js"></script></body></html>
